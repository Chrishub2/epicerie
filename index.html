<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Épicerie</title>
<meta name="theme-color" content="#1f7a4d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone.svg">
<script>
  // Thème choisi sur cet appareil (Plus → Apparence), appliqué avant l'affichage pour éviter un flash.
  try { const t = localStorage.getItem('theme'); if (t === 'sombre') document.documentElement.dataset.theme = 'dark'; if (t === 'clair') document.documentElement.dataset.theme = 'light'; } catch (e) {}
</script>
<style>
:root {
  --fond: #f5f6f3; --carte: #ffffff; --texte: #1d2320; --doux: #66706a; --ligne: #e3e6e1;
  --accent: #1f7a4d; --accent-doux: #e3f2ea;
  --vert: #1f8a50; --vert-fond: #e1f4e8; --ambre: #b26a00; --ambre-fond: #fff1d6;
  --rouge: #c0392b; --rouge-fond: #fde7e4; --gris-fond: #f0f1ee;
  --ombre: 0 1px 3px rgba(0,0,0,.08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fond: #121513; --carte: #1b1f1c; --texte: #e8ece9; --doux: #9aa59e; --ligne: #2c322e;
    --accent: #4cc38a; --accent-doux: #1d3328;
    --vert: #4cc38a; --vert-fond: #173426; --ambre: #f0b14a; --ambre-fond: #3a2c12;
    --rouge: #ff7a6b; --rouge-fond: #3b1d19; --gris-fond: #232824;
    --ombre: none;
  }
}
/* Mode sombre forcé (Plus → Apparence → Sombre) */
:root[data-theme="dark"] {
  --fond: #121513; --carte: #1b1f1c; --texte: #e8ece9; --doux: #9aa59e; --ligne: #2c322e;
  --accent: #4cc38a; --accent-doux: #1d3328;
  --vert: #4cc38a; --vert-fond: #173426; --ambre: #f0b14a; --ambre-fond: #3a2c12;
  --rouge: #ff7a6b; --rouge-fond: #3b1d19; --gris-fond: #232824;
  --ombre: none;
}
:root[data-theme="dark"] { color-scheme: dark; }
:root[data-theme="light"] { color-scheme: light; }
/* Logos de bannières (pastilles aux couleurs de la marque) */
.logo { display: inline-block; font-weight: 800; font-size: 12px; line-height: 1; padding: 4px 7px; border-radius: 6px;
  letter-spacing: .02em; white-space: nowrap; vertical-align: middle; font-family: system-ui, sans-serif; }
.logo-iga { background: #d6001c; color: #fff; }
.logo-super_c { background: #ffd200; color: #e30613; font-style: italic; }
.logo-metro { background: #111; color: #fff; text-transform: lowercase; }
.logo-maxi { background: #ffe100; color: #111; border: 2px solid #e30613; padding: 2px 6px; }
.logo-costco { background: #fff; color: #e31837; border-bottom: 3px solid #005daa; box-shadow: 0 0 0 1px #d5d9e0 inset; }
.logo-jean_coutu { background: #003da5; color: #fff; font-weight: 700; }
.logo-provigo { background: #e2231a; color: #fff; text-transform: lowercase; }
.logo-walmart { background: #0071ce; color: #fff; }
.logo-voila { background: #6a1b9a; color: #fff; text-transform: lowercase; }
.logo-instacart { background: #0aad0a; color: #fff; text-transform: lowercase; }
.icone.photo-mag { width: 40px; height: 40px; border-color: var(--accent); background: var(--accent-doux); font-size: 18px; }
.res-choix { cursor: pointer; }
.vignette.mini { width: 28px; height: 28px; border-radius: 6px; flex: none; }
.manquants { border-color: var(--ambre); background: var(--ambre-fond); }
.ville { color: var(--doux); font-size: 12px; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--fond); color: var(--texte);
  font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
body { padding-bottom: calc(68px + env(safe-area-inset-bottom)); }
/* L'en-tête défile avec la page ; les barres d'outils de chaque onglet restent collées en haut. */
header { background: #1f7a4d; color: #fff;
  padding: calc(6px + env(safe-area-inset-top)) 16px 6px; display: flex; align-items: center; gap: 10px; }
header h1 { font-size: 17px; margin: 0; flex: 1; }
header select { background: rgba(255,255,255,.15); color: #fff; border: 1px solid rgba(255,255,255,.35);
  border-radius: 8px; padding: 4px 6px; font-size: 14px; }
header select option { color: #000; }
.bandeau-demo { background: var(--ambre-fond); color: var(--ambre); font-size: 13px; padding: 6px 16px; }
.bandeau-demo.ok { background: var(--vert-fond); color: var(--vert); }
main { padding: 12px 16px; max-width: 720px; margin: 0 auto; }
nav.onglets { position: fixed; bottom: 0; left: 0; right: 0; z-index: 6; display: flex;
  background: var(--carte); border-top: 1px solid var(--ligne); padding-bottom: env(safe-area-inset-bottom); }
nav.onglets button { flex: 1; border: 0; background: none; color: var(--doux); padding: 8px 0 10px;
  font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
nav.onglets button span { font-size: 20px; }
nav.onglets button.actif { color: var(--accent); font-weight: 600; }
.carte { background: var(--carte); border-radius: 12px; box-shadow: var(--ombre); border: 1px solid var(--ligne);
  padding: 12px; margin-bottom: 12px; }
h2 { font-size: 17px; margin: 4px 0 10px; }
h3 { font-size: 15px; margin: 0 0 6px; }
.doux { color: var(--doux); font-size: 13px; }
.rang { display: flex; gap: 8px; align-items: center; }
.rang.envelopper { flex-wrap: wrap; }
.grandir { flex: 1; min-width: 0; }
input, select, textarea { font: inherit; color: var(--texte); background: var(--carte); border: 1px solid var(--ligne);
  border-radius: 8px; padding: 8px 10px; width: 100%; }
textarea { min-height: 120px; }
/* Cases et boutons radio : jamais pleine largeur (sinon ils écrasent le texte, surtout sur iPhone) */
input[type=checkbox], input[type=radio] { width: auto; flex: none; padding: 0; }
.item input[type=radio] { width: 22px; height: 22px; accent-color: var(--accent); }
button.btn { font: inherit; border: 0; border-radius: 10px; padding: 9px 12px; background: var(--accent); color: #fff;
  font-weight: 600; white-space: nowrap; }
button.btn.sec { background: var(--accent-doux); color: var(--accent); }
button.btn.danger { background: var(--rouge-fond); color: var(--rouge); }
button.icone { font-size: 20px; width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--ligne);
  background: var(--carte); color: var(--texte); flex: none; }
.ajout, .barre-collante { position: sticky; top: 0; z-index: 4; background: var(--fond);
  padding: calc(8px + env(safe-area-inset-top)) 0 8px; margin: -12px 0 6px; box-shadow: 0 6px 6px -6px rgba(0,0,0,.25); }
.liste-arret { list-style: none; margin: 4px 0 0; padding: 0; }
.liste-arret li { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0 5px 12px;
  border-top: 1px solid var(--ligne); font-size: 14px; position: relative; }
.liste-arret li::before { content: "•"; position: absolute; left: 0; color: var(--doux); }
.liste-arret li .doux { white-space: nowrap; }
.alerte { border-radius: 10px; padding: 8px 10px; margin-bottom: 8px; font-size: 14px; }
.alerte.ambre { background: var(--ambre-fond); color: var(--ambre); }
.alerte.rouge { background: var(--rouge-fond); color: var(--rouge); }
.alerte.vert { background: var(--vert-fond); color: var(--vert); }
.alerte-action { display: flex; align-items: flex-start; gap: 8px; cursor: pointer; }
.fermer-alerte { flex: none; border: 0; background: transparent; color: inherit; font-size: 16px; line-height: 1;
  padding: 2px 4px; margin: -2px -4px 0 0; opacity: .75; cursor: pointer; }
/* Saisie avec suggestions */
.icone.entree { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 700; }
.suggestions { background: var(--carte); border: 1px solid var(--ligne); border-radius: 10px; margin-top: 6px; overflow: hidden;
  box-shadow: 0 6px 16px rgba(0,0,0,.18); }
.sugg { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 10px; border: 0; border-top: 1px solid var(--ligne);
  background: none; color: var(--texte); font: inherit; text-align: left; cursor: pointer; }
.sugg:first-child { border-top: 0; }
span.vignette { display: inline-block; background: var(--gris-fond); }
/* Couleurs : vert = moins cher, rouge = plus cher */
table.comp tr.cher td { background: var(--rouge-fond); }
table.comp tr.cher td.pu { color: var(--rouge); }
table.matrice td.cher { background: var(--rouge-fond); color: var(--rouge); }
.item.res-vert { border-color: var(--vert); background: var(--vert-fond); }
.item.res-rouge { border-color: var(--rouge); background: var(--rouge-fond); }
.pu-res { text-align: right; font-weight: 700; font-size: 14px; white-space: nowrap; }
.pu-res.vert { color: var(--vert); } .pu-res.rouge { color: var(--rouge); }
/* Optimiseur : bannières forcées / ignorées */
.puce-ban { font: inherit; font-size: 13px; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--ligne);
  background: var(--carte); color: var(--texte); cursor: pointer; }
.puce-ban.forcee { background: var(--vert-fond); color: var(--vert); border-color: var(--vert); font-weight: 700; }
.puce-ban.ignoree { background: var(--gris-fond); color: var(--doux); text-decoration: line-through; }
/* Fenêtre « Mise à jour disponible » */
.maj-fond { position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,.55); display: grid; place-items: center; padding: 16px; }
.maj-boite { background: var(--carte); color: var(--texte); border-radius: 16px; padding: 20px; width: min(360px, 100%);
  text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
.maj-boite h2 { margin: 6px 0 8px; }
/* Caméra des reçus (plein écran, cadre jaune) */
.camera-recu { position: fixed; inset: 0; z-index: 100; background: #000; }
.camera-recu video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.camera-recu.flash { background: #fff; }
.camera-recu.flash video { opacity: .4; }
.cadre-jaune { position: absolute; left: 19%; width: 62%; top: 7%; height: 86%; border: 3px solid #ffd400; border-radius: 8px;
  box-shadow: 0 0 0 9999px rgba(0,0,0,.45); display: flex; align-items: flex-start; justify-content: center; pointer-events: none; }
.cam-raccord { position: absolute; top: 0; left: 0; right: 0; height: 18%; overflow: hidden; border-bottom: 2px dashed #ffd400; }
.cam-raccord img { width: 100%; height: 100%; object-fit: cover; object-position: bottom; opacity: .5; display: block; }
.cam-raccord em { position: absolute; bottom: 4px; left: 0; right: 0; text-align: center; font-size: 11px; font-style: normal; font-weight: 700; color: #ffd400; text-shadow: 0 1px 2px #000; }
.cadre-jaune > span { position: relative; z-index: 1; }
.cadre-jaune span { margin-top: 8px; background: #ffd400; color: #000; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 6px; }
.cam-haut { position: absolute; top: calc(8px + env(safe-area-inset-top)); left: 0; right: 0; text-align: center; color: #fff;
  display: flex; flex-direction: column; gap: 2px; font-size: 14px; text-shadow: 0 1px 2px #000; }
.doux-blanc { opacity: .85; font-size: 12px; }
.cam-bas { position: absolute; bottom: calc(18px + env(safe-area-inset-bottom)); left: 0; right: 0; display: flex;
  justify-content: space-around; align-items: center; }
.cam-declencheur { width: 72px; height: 72px; border-radius: 50%; border: 5px solid #fff; background: #ffd400; cursor: pointer; }
.cam-btn { font: inherit; font-weight: 700; padding: 10px 14px; border-radius: 12px; border: 0; background: #ffd400; color: #000; }
.cam-btn.sec { background: rgba(255,255,255,.2); color: #fff; }
.cam-btn:disabled { opacity: .4; }
.cam-secours { position: absolute; left: 16px; right: 16px; top: 40%; display: flex; flex-direction: column; gap: 10px; align-items: stretch; text-align: center; color: #fff; z-index: 2; }
.recu-entier { max-height: 60vh; overflow-y: auto; border-radius: 8px; background: #fff; }
.recu-entier img { display: block; width: 100%; }
/* Tirer pour actualiser */
#tirer { position: fixed; top: 0; left: 50%; transform: translate(-50%, -60px); z-index: 60; background: var(--carte);
  color: var(--accent); border: 1px solid var(--ligne); border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 600;
  box-shadow: 0 4px 10px rgba(0,0,0,.2); transition: transform .15s; pointer-events: none; }
/* Recettes */
.groupe-livre { margin-bottom: 10px; }
.groupe-livre > summary { display: flex; align-items: center; gap: 8px; padding: 8px 4px; font-weight: 700; cursor: pointer; list-style: none; }
.vig-recette { width: 56px; height: 56px; flex: none; display: block; overflow: hidden; border-radius: 8px; }
.vig-recette figure { margin: 0; }
.vig-recette img { width: 56px !important; height: 56px !important; object-fit: cover; border-radius: 8px; }
.vig-recette figcaption { display: none; }
.item.recette .nom { word-break: break-word; }
.etape { margin-bottom: 12px; }
.vig-livre { width: 34px; height: 44px; flex: none; overflow: hidden; border-radius: 4px; }
.vig-livre figure { margin: 0; } .vig-livre figcaption { display: none; }
.vig-livre img { width: 34px !important; height: 44px !important; object-fit: cover; border-radius: 4px; }
.comparer-photos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.choix-photo { border: 2px solid var(--ligne); border-radius: 10px; padding: 4px; background: var(--carte); color: var(--texte);
  font: inherit; font-size: 13px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; align-items: center; }
.choix-photo img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; }
.choix-photo.actif { border-color: var(--accent); background: var(--accent-doux); font-weight: 700; }
.grille-photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.grille-photos .choix-photo { font-size: 11px; font-weight: 400; min-width: 0; overflow: hidden; }
.grille-photos .choix-photo span { display: block; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.grille-photos .choix-photo img { background: #fff; object-fit: contain; }
/* Sous-onglets de Comparer : Tableau · Détails · Online · Écono */
.sous-onglets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.sous-onglets button { font: inherit; font-size: 14px; font-weight: 600; padding: 8px 4px; border-radius: 10px; border: 1px solid var(--ligne);
  background: var(--carte); color: var(--texte); cursor: pointer; }
.sous-onglets button.actif { background: var(--accent); color: #fff; border-color: var(--accent); }
/* Liste regroupée par magasin (vue « Tout ») */
.puce-filtre { padding: 5px 10px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.groupe-mag { border: 1px solid var(--ligne); border-radius: 12px; margin-bottom: 10px; background: var(--gris-fond); overflow: hidden; }
.tete-mag { display: flex; align-items: center; gap: 8px; width: 100%; padding: 10px 12px; border: 0; background: var(--carte);
  color: var(--texte); font: inherit; cursor: pointer; text-align: left; }
.groupe-mag:not(.ferme) .tete-mag { border-bottom: 1px solid var(--ligne); }
.tete-mag .fleche { color: var(--doux); width: 14px; }
.corps-mag { padding: 0 8px 4px; }
.reorg li.flash { background: var(--vert-fond); transition: background .2s; }
.reorg li .icone { width: 40px; height: 40px; }
/* Rayons regroupés */
.reorg li.joint { margin-top: -6px; border-top-left-radius: 0; border-top-right-radius: 0; border-left: 4px solid var(--accent); }
/* Magasins compacts */
.titre-cp { color: var(--doux); font-size: 13px; text-transform: uppercase; letter-spacing: .03em; margin: 14px 2px 6px; }
.mag-ligne { display: flex; align-items: center; gap: 8px; padding: 4px 8px; background: var(--carte); border: 1px solid var(--ligne);
  border-radius: 10px; margin-bottom: 4px; min-height: 48px; }
.mag-ligne .icone { width: 36px; height: 36px; font-size: 16px; padding: 0; }
.mag-ligne .logo { font-size: 13px; }
.nom-mag { border: 0; background: none; color: var(--texte); font: inherit; text-align: left; padding: 8px 4px; cursor: pointer; min-width: 0; }
.btn-releve { flex: none; width: 56px; height: 44px; font-size: 24px; border-radius: 12px; border: 1px solid var(--accent);
  background: var(--accent-doux); cursor: pointer; }
.mag-ligne.inactif { opacity: .55; }
.interrupteur { position: relative; width: 40px; height: 24px; flex: none; }
.interrupteur input { opacity: 0; width: 0; height: 0; position: absolute; }
.interrupteur span { position: absolute; inset: 0; background: var(--ligne); border-radius: 999px; transition: .2s; cursor: pointer; }
.interrupteur span::before { content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
.interrupteur input:checked + span { background: var(--accent); }
.interrupteur input:checked + span::before { transform: translateX(16px); }
.une-ligne { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.vignette.petite { width: 32px; height: 32px; }
.rayon { margin-bottom: 10px; }
.rayon > h3 { display: flex; align-items: center; gap: 6px; color: var(--doux); font-size: 13px;
  text-transform: uppercase; letter-spacing: .03em; margin: 12px 2px 6px; }
.item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: var(--carte);
  border: 1px solid var(--ligne); border-radius: 10px; margin-bottom: 6px; }
.item input[type=checkbox] { width: 24px; height: 24px; flex: none; accent-color: var(--accent); }
.item.coche .nom { text-decoration: line-through; color: var(--doux); }
.item .nom { font-weight: 600; }
.item .info { font-size: 12px; color: var(--doux); }
.qte { display: flex; align-items: center; gap: 4px; }
.qte button { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--ligne); background: var(--gris-fond);
  color: var(--texte); font-size: 16px; }
.pastille { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--gris-fond);
  color: var(--doux); margin-right: 4px; white-space: nowrap; }
.pastille.vert { background: var(--vert-fond); color: var(--vert); }
.pastille.ambre { background: var(--ambre-fond); color: var(--ambre); }
.pastille.rouge { background: var(--rouge-fond); color: var(--rouge); }
.ban { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: middle; }
table.comp { width: 100%; border-collapse: collapse; font-size: 14px; }
table.comp td { padding: 7px 6px; border-top: 1px solid var(--ligne); vertical-align: top; }
table.comp tr.meilleur td { background: var(--vert-fond); }
table.comp tr.proche td { background: var(--ambre-fond); }
table.comp td.pu { text-align: right; font-weight: 600; white-space: nowrap; }
table.comp tr.meilleur td.pu { color: var(--vert); }
table.comp tr.proche td.pu { color: var(--ambre); }
.vignette { width: 44px; height: 44px; object-fit: contain; border-radius: 8px; background: #fff; flex: none; cursor: pointer; }
.item .vignette { width: 48px; height: 48px; }
.item-liste { flex-wrap: wrap; row-gap: 6px; }
.item.recu-ok { border-color: var(--vert); background: var(--vert-fond); }
.item.recu-ecart { border-color: var(--rouge); background: var(--rouge-fond); }
.item-recu.ok, .item-recu.ecart { font-weight: 800; }
.item-liste .item-recu { flex-basis: 100%; order: -1; font-size: 12px; font-weight: 600; cursor: pointer; }
.item-recu.ok { color: var(--vert); }
.item-recu.ecart { color: var(--rouge); }
.item-liste .qte { flex: none; }
.item-liste .grandir { min-width: 0; }
.item.coche .item-recu { text-decoration: none; }
.tableau-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--ligne); border-radius: 12px;
  background: var(--carte); margin-bottom: 6px; }
table.matrice { border-collapse: separate; border-spacing: 0; font-size: 13px; min-width: 100%; }
table.matrice th, table.matrice td { padding: 7px 8px; border-bottom: 1px solid var(--ligne); text-align: left;
  vertical-align: top; white-space: nowrap; }
table.matrice thead th { position: sticky; top: 0; background: var(--gris-fond); font-weight: 600; }
table.matrice tbody th { position: sticky; left: 0; z-index: 1; background: var(--carte); font-weight: 600;
  white-space: normal; min-width: 110px; max-width: 130px; cursor: pointer; border-right: 1px solid var(--ligne); }
table.matrice thead th:first-child { left: 0; z-index: 2; position: sticky; }
table.matrice td.meilleur { background: var(--vert-fond); color: var(--vert); outline: 2px solid var(--vert); outline-offset: -2px; }
table.matrice td.proche { background: var(--ambre-fond); color: var(--ambre); }
table.matrice td.vide-cel { color: var(--doux); text-align: center; }
details > summary { list-style: none; cursor: pointer; }
details > summary::-webkit-details-marker { display: none; }
.reorg { list-style: none; padding: 0; margin: 0; }
.reorg li { display: flex; align-items: center; gap: 10px; padding: 10px; background: var(--carte); border: 1px solid var(--ligne);
  border-radius: 10px; margin-bottom: 6px; user-select: none; }
.reorg li.glisse { opacity: .6; outline: 2px dashed var(--accent); }
.poignee { touch-action: none; cursor: grab; font-size: 20px; color: var(--doux); padding: 0 4px; }
dialog { border: 0; border-radius: 14px; padding: 0; width: min(560px, calc(100vw - 24px)); max-height: 88vh;

.vignettes figcaption { font-size: 11px; color: var(--doux); }

.cache { display: none !important; }
