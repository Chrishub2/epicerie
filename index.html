<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Épicerie</title>
<meta name="theme-color" content="#1f7a4d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>
  // Thème choisi sur cet appareil (Plus → Apparence), appliqué avant l'affichage pour éviter un flash.
  try { const t = localStorage.getItem('theme'); if (t === 'sombre') document.documentElement.dataset.theme = 'dark'; if (t === 'clair') document.documentElement.dataset.theme = 'light'; } catch (e) {}
</script>
<style>
:root {
  --fond: #f5f6f3; --carte: #ffffff; --texte: #1d2320; --doux: #66706a; --ligne: #e3e6e1;
  --accent: #1f7a4d; --accent-doux: #e3f2ea;
  --vert: #1f8a50; --vert-fond: #e1f4e8; --ambre: #b26a00; --ambre-fond: #fff1d6;
  --rouge: #c0392b; --rouge-fond: #fde7e4; --gris-fond: #f0f1ee;
  --ombre: 0 1px 3px rgba(0,0,0,.08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fond: #121513; --carte: #1b1f1c; --texte: #e8ece9; --doux: #9aa59e; --ligne: #2c322e;
    --accent: #4cc38a; --accent-doux: #1d3328;
    --vert: #4cc38a; --vert-fond: #173426; --ambre: #f0b14a; --ambre-fond: #3a2c12;
    --rouge: #ff7a6b; --rouge-fond: #3b1d19; --gris-fond: #232824;
    --ombre: none;
  }
}
/* Mode sombre forcé (Plus → Apparence → Sombre) */
:root[data-theme="dark"] {
  --fond: #121513; --carte: #1b1f1c; --texte: #e8ece9; --doux: #9aa59e; --ligne: #2c322e;
  --accent: #4cc38a; --accent-doux: #1d3328;
  --vert: #4cc38a; --vert-fond: #173426; --ambre: #f0b14a; --ambre-fond: #3a2c12;
  --rouge: #ff7a6b; --rouge-fond: #3b1d19; --gris-fond: #232824;
  --ombre: none;
}
:root[data-theme="dark"] { color-scheme: dark; }
:root[data-theme="light"] { color-scheme: light; }
/* Logos de bannières (pastilles aux couleurs de la marque) */
.logo { display: inline-block; font-weight: 800; font-size: 12px; line-height: 1; padding: 4px 7px; border-radius: 6px;
  letter-spacing: .02em; white-space: nowrap; vertical-align: middle; font-family: system-ui, sans-serif; }
.logo-iga { background: #d6001c; color: #fff; }
.logo-super_c { background: #ffd200; color: #e30613; font-style: italic; }
.logo-metro { background: #111; color: #fff; text-transform: lowercase; }
.logo-maxi { background: #ffe100; color: #111; border: 2px solid #e30613; padding: 2px 6px; }
.logo-costco { background: #fff; color: #e31837; border-bottom: 3px solid #005daa; box-shadow: 0 0 0 1px #d5d9e0 inset; }
.logo-jean_coutu { background: #003da5; color: #fff; font-weight: 700; }
.logo-provigo { background: #e2231a; color: #fff; text-transform: lowercase; }
.logo-walmart { background: #0071ce; color: #fff; }
.logo-voila { background: #6a1b9a; color: #fff; text-transform: lowercase; }
.logo-instacart { background: #0aad0a; color: #fff; text-transform: lowercase; }
.icone.photo-mag { width: 40px; height: 40px; border-color: var(--accent); background: var(--accent-doux); font-size: 18px; }
.res-choix { cursor: pointer; }
.vignette.mini { width: 28px; height: 28px; border-radius: 6px; flex: none; }
.manquants { border-color: var(--ambre); background: var(--ambre-fond); }
.ville { color: var(--doux); font-size: 12px; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--fond); color: var(--texte);
  font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
body { padding-bottom: calc(68px + env(safe-area-inset-bottom)); }
/* En-tête vert uni. Onglet Liste : lecteur · total · ajout + puces, collé en haut. Autres onglets : simple bande. */
header { background: #1f7a4d; color: #fff;
  padding: calc(6px + env(safe-area-inset-top)) 10px 6px; display: block; }
body.onglet-liste header { position: sticky; top: 0; z-index: 7; padding-bottom: 8px; }
body:not(.onglet-liste) .barre-liste, body:not(.onglet-liste) .puces-mag { display: none; }
/* Calendrier de l'en-tête : couleurs en transparence pour suivre chaque habillage */
.cal-entete { display: flex; align-items: center; justify-content: center; gap: 8px; max-width: 720px; margin: 0 auto 6px; }
.cal-entete .cal-m { font-weight: 700; font-size: 13px; opacity: .9; min-width: 34px; text-transform: capitalize; }
.cal-entete .cal-m:first-child { text-align: right; }
.cal-g { position: relative; display: grid; grid-template-columns: repeat(7, 30px); grid-template-rows: 11px 18px 18px; column-gap: 3px; row-gap: 2px; }
.cal-l { font-size: 9.5px; font-weight: 700; text-align: center; line-height: 11px; opacity: .75; }
.cal-j { display: grid; place-items: center; border-radius: 4px; font-size: 12px; font-weight: 600; line-height: 1; background: rgba(255,255,255,.14); font-variant-numeric: tabular-nums; }
.cal-j.fds { background: rgba(0,0,0,.28); }
.cal-j.auj { background: rgba(255,213,79,.30); box-shadow: inset 0 0 0 1.5px #ffd54f; }
.cal-coupure { justify-self: start; width: 0; margin-left: -3px; border-left: 2.5px solid currentColor; border-radius: 2px; opacity: .85; }
@media (min-width: 560px) { .cal-g { grid-template-columns: repeat(7, 36px); } .cal-entete .cal-m { font-size: 14px; min-width: 64px; } }
.barre-liste { position: relative; display: flex; align-items: center; height: 40px; max-width: 720px; margin: 0 auto; }
.tuile-scan { width: 96px; height: 38px; border-radius: 10px; border: 0; background: var(--entete-tuile, rgba(0,0,0,.22));
  color: inherit; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; flex: none; }
.total-liste { position: absolute; left: 50%; transform: translateX(-50%); font-size: 19px; font-weight: 700;
  white-space: nowrap; pointer-events: none; font-variant-numeric: tabular-nums;
  display: flex; flex-direction: column; align-items: center; line-height: 1; }
/* Économie totale : petite étiquette sous le total (même calcul que les économies sous chaque bannière) */
.total-liste .tl-eco { display: inline-flex; align-items: center; gap: 4px; margin-top: 3px; padding: 2px 8px 2px 6px;
  border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: .01em; color: #0f4d2f;
  background: linear-gradient(135deg, #d7f7e4, #a8e6c4); box-shadow: 0 1px 0 rgba(0,0,0,.18); }
.total-liste .tl-eco svg { flex: none; }
.champ-ajout { position: absolute; right: 0; top: 1px; width: 112px; height: 38px; display: flex; border-radius: 10px;
  overflow: hidden; background: var(--entete-tuile, rgba(0,0,0,.22)); transition: width .2s; z-index: 3; }
.champ-ajout.ouvert { width: 100%; background: var(--carte); color: var(--texte); box-shadow: 0 0 0 2px currentColor; }
.champ-ajout input { flex: 1; min-width: 0; border: 0; border-radius: 0; background: transparent; color: inherit;
  padding: 0 10px; height: 38px; font-size: 16px; }
.champ-ajout input::placeholder { color: currentColor; opacity: .7; }
.champ-ajout:not(.ouvert) input { font-size: 15px; padding: 0 6px 0 9px; }
.champ-ajout input:focus { outline: none; }
.champ-ajout button { width: 40px; flex: none; border: 0; font-size: 18px; font-weight: 700; cursor: pointer;
  background: var(--entete-ok-fond, #2fbf7a); color: var(--entete-ok-texte, #0f3d27); }
/* « ← » : fermer le champ sans rien ajouter (visible seulement quand le champ est ouvert) */
.champ-ajout .fermer-saisie { display: none; width: 40px; background: transparent; color: inherit; font-size: 20px; font-weight: 600; }
.champ-ajout.ouvert .fermer-saisie { display: block; }
/* Pendant la saisie : le reste de l'écran passe sous un voile ; seuls le champ et ses propositions restent nets */
.voile-saisie { display: none; position: fixed; inset: 0; z-index: 6; background: rgba(0, 0, 0, .55); }
body.saisie-active .voile-saisie { display: block; }
body.saisie-active header :is(.cal-entete, .puces-mag, .mode-magasin) { opacity: .25; }
body.saisie-active nav.onglets { opacity: .25; pointer-events: none; }
.champ-ajout.charge button:not(.fermer-saisie) { font-size: 0; }
.champ-ajout.charge button:not(.fermer-saisie)::after { content: ''; display: inline-block; width: 16px; height: 16px; border-radius: 50%;
  border: 2px solid currentColor; border-right-color: transparent; animation: tourne .8s linear infinite; }
@keyframes tourne { to { transform: rotate(360deg); } }
.puces-mag { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(62px, 1fr); gap: 5px; margin: 8px auto 0;
  max-width: 720px; overflow-x: auto; scrollbar-width: none; }
.puces-mag button { font: inherit; font-size: 12px; padding: 5px 2px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--entete-puce-bord, rgba(255,255,255,.45)); background: transparent; color: inherit;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.puces-mag button.actif { background: var(--entete-puce-actif, #fff); color: var(--entete-puce-actif-texte, #0f3d27);
  border-color: var(--entete-puce-actif, #fff); font-weight: 700; }
/* Prépa. : puces cachées en descendant (la marge garde la page en place) */
header.puces-masquees .puces-mag { display: none; }
/* Une bannière choisie : « Mode Magasin » écrit à la plume sous les puces */
body:not(.onglet-liste) .mode-magasin { display: none; }
.mode-magasin { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 6px auto 0; max-width: 720px; }
.mode-magasin[hidden] { display: none; }
.mode-magasin::before, .mode-magasin::after { content: ''; flex: 0 1 46px; height: 1px;
  background: linear-gradient(90deg, transparent, currentColor); opacity: .55; }
.mode-magasin::after { background: linear-gradient(90deg, currentColor, transparent); }
.mm-titre { font-family: "Dancing Script", "Segoe Script", "Snell Roundhand", cursive; font-size: 27px; font-weight: 700;
  line-height: 1.1; letter-spacing: .01em; }
.mm-ban { font-size: 12px; opacity: .8; white-space: nowrap; align-self: flex-end; padding-bottom: 4px; }
header .suggestions { position: absolute; left: 8px; right: 8px; top: 100%; margin-top: 2px; max-height: 60vh; overflow-y: auto;
  color: var(--texte); z-index: 8; }
/* Barre du bas : cachée en descendant, revient en remontant */
nav.onglets { transition: transform .2s; }
nav.onglets.masquee { transform: translateY(110%); }
/* Taille d'affichage (zoom du contenu, pas de l'en-tête) */
.zoom-vue { position: fixed; left: 0; top: 45%; z-index: 9; display: flex; align-items: center; }
.zoom-poignee { width: 7px; height: 64px; border: 0; padding: 0; border-radius: 0 6px 6px 0; background: var(--doux); opacity: .45; cursor: pointer; }
.zoom-rail { display: none; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px; background: var(--carte);
  border: 1px solid var(--ligne); border-left: 0; border-radius: 0 12px 12px 0; box-shadow: 0 4px 12px rgba(0,0,0,.2);
  font-size: 11px; color: var(--doux); }
.zoom-vue.ouvert .zoom-poignee { display: none; }
.zoom-vue.ouvert .zoom-rail { display: flex; }
.zoom-rail input { writing-mode: vertical-lr; direction: rtl; width: 24px; height: 150px; margin: 0; padding: 0; accent-color: var(--accent); }
/* Fenêtre ouverte : la page derrière ne défile pas */
html.modale-ouverte, html.modale-ouverte body { overflow: hidden; }
/* ===== Liste — Préparation (tableau par bannière) ===== */
/* Marge de 14 px à gauche : la poignée du zoom (bord de l'écran) reste facile à attraper */
.prep { margin: -12px -16px 0 -2px; }
.prep-defile { overflow-x: auto; -webkit-overflow-scrolling: touch; }
/* Tête des colonnes (Photo/Liste, Deal, bannières et totaux) : flotte sous l'en-tête pendant le défilement */
.prep-tete { position: sticky; top: var(--haut-entete, 0px); z-index: 5; overflow-x: auto; scrollbar-width: none;
  background: var(--fond); box-shadow: 0 2px 4px rgba(0,0,0,.12); }
.prep-tete::-webkit-scrollbar { display: none; }
table.prep-t { border-collapse: separate; border-spacing: 0; table-layout: fixed; font-size: 13px; }
.prep.seule table.prep-t { width: 100%; }
.prep-t th, .prep-t td { padding: 0 2px; vertical-align: middle; border-bottom: 1px solid var(--ligne); }
.prep-t thead th { height: 66px; font-weight: 400; font-size: 11px; color: var(--doux); text-align: center; background: var(--fond); }
.prep-t tr.pl td { height: 56px; }
.prep-t .pc { position: sticky; left: 0; z-index: 2; background: var(--fond); border-right: 1px solid var(--ligne); padding: 0 4px 0 8px; text-align: left; }
.prep.seule .pc { border-right: 0; padding-right: 10px; }
/* Mode Liste (maquette v3) : rangées enrichies, bilan des arrêts, bascule rayon / magasin, sous-totaux */
.prep-t tr.pl.ls td { height: auto; padding: 7px 8px; }
.ls-r { display: flex; align-items: center; gap: 9px; }
.ls-tx { flex: 1; min-width: 0; cursor: pointer; }
.ls-nom { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ls-sous { color: var(--doux); font-size: 11px; font-weight: 400; }
.ls-prix { display: flex; align-items: baseline; gap: 5px; margin-top: 2px; white-space: nowrap; overflow: hidden; }
.ls-prix .logo { font-size: 9px; padding: 2px 5px; border-radius: 4px; align-self: center; }
.ls-pp { font-size: 13px; }
.ls-pp.promo { color: var(--rouge); }
.ls-prix s { color: var(--doux); font-size: 11px; }
.ls-pu { color: var(--doux); font-size: 11px; opacity: .8; }
.ls-ch { display: flex; flex-wrap: wrap; gap: 3px 4px; margin-top: 3px; max-height: 34px; overflow: hidden; }
.lch { font-size: 10px; line-height: 15px; padding: 0 6px; border-radius: 8px; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis;
  background: var(--gris-fond); color: var(--texte); }
.lch.ok { background: color-mix(in srgb, var(--vert) 18%, transparent); color: var(--vert); }
.lch.wa { background: color-mix(in srgb, #e8a400 22%, transparent); color: #b07d00; }
.lch.al { background: color-mix(in srgb, var(--rouge) 18%, transparent); color: var(--rouge); }
.lch.ur { background: color-mix(in srgb, #ff8a1f 28%, transparent); color: #d9690a; font-weight: 600; }
.lch.rec { background: color-mix(in srgb, #3b82f6 18%, transparent); color: #3b74d4; }
.lch.rec.top { background: #3b82f6; color: #fff; font-weight: 600; }
@media (prefers-color-scheme: dark) { .lch.wa { color: #f0c35a; } .lch.ur { color: #ffb366; } .lch.rec { color: #86b2ef; } }
.ls-d { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: none; }
.ls-tot { font-size: 13px; font-variant-numeric: tabular-nums; }
.ls-pm { display: flex; gap: 4px; }
.ls-pm button { width: 30px; height: 26px; border-radius: 7px; border: 1px solid var(--ligne); background: var(--gris-fond); color: var(--texte); font-size: 16px; line-height: 1; padding: 0; cursor: pointer; }
.prep.seule .pr-nom { position: static; display: flex; padding: 0 10px 0 8px; }
.pr-st { margin-left: auto; font-variant-numeric: tabular-nums; }
.pr-nom .logo { font-size: 9px; padding: 2px 5px; border-radius: 4px; }
.prep-t tr.ls-bilan td, .prep-t tr.ls-seg td { padding: 6px 8px 0; border-bottom: 0; }
.bil { background: var(--carte); border: 1px solid var(--ligne); border-radius: 12px; padding: 8px 10px; font-size: 12px; }
.bil-l { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.bil-l + .bil-l { margin-top: 3px; }
.bil-doux { color: var(--doux); font-size: 11px; }
.bil-eco, .bil-ok { color: var(--vert); }
.bil-wa { color: #c48a00; }
.bil-rec { color: #3b74d4; font-weight: 600; }
@media (prefers-color-scheme: dark) { .bil-wa { color: #f0c35a; } .bil-rec { color: #86b2ef; } }
.seg-gr { display: flex; background: var(--gris-fond); border-radius: 9px; padding: 2px; margin-bottom: 6px; }
.seg-gr button { flex: 1; border: 0; background: transparent; color: var(--doux); font: inherit; font-size: 12px; padding: 5px; border-radius: 7px; cursor: pointer; }
.seg-gr button.on { background: var(--carte); color: var(--texte); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.15); }
.prep-t .pc-tete { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
/* Nombre d'articles : chiffre fort dans une tuile douce, petit libellé dessous */
.p-nb { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 46px; padding: 5px 6px 4px;
  border-radius: 12px; background: var(--accent-doux); color: var(--accent); line-height: 1; font-variant-numeric: tabular-nums;
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 25%, transparent); }
.p-nb b { font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
.p-nb span { font-size: 9px; font-weight: 600; margin-top: 2px; opacity: .85; }
.prep.photo:not(.seule) .p-nb { display: none; }
.prep-t .bascules { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.prep-t .bascule { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--doux); cursor: pointer; white-space: nowrap; }
.prep-t .bascule .interrupteur { width: 34px; height: 20px; }
.prep-t .bascule .interrupteur span::before { width: 14px; height: 14px; }
.prep-t .bascule .interrupteur input:checked + span::before { transform: translateX(14px); }
.prep.photo:not(.seule) .bascule .lib { display: none; }
.p-deal { width: 100%; font: inherit; font-size: 12px; font-weight: 700; padding: 6px 0; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--accent); background: transparent; color: var(--accent); }
.p-tot { font-size: 11px; font-weight: 700; color: var(--texte); margin-bottom: 3px; white-space: nowrap; }
.p-eco { font-size: 10px; color: var(--vert); margin-top: 3px; min-height: 13px; white-space: nowrap; }
.prep-t .logo { font-size: 10px; padding: 3px 5px; }
.p-ajban { width: 28px; height: 28px; border-radius: 50%; border: 1px dashed var(--doux); background: none; color: var(--doux); font-size: 16px; cursor: pointer; }
.prep-t tr.pr td { height: 22px; padding: 0; background: var(--gris-fond); }
.pr-nom { position: sticky; left: 8px; display: inline-flex; align-items: center; gap: 8px; font-size: 11px; color: var(--doux);
  white-space: nowrap; padding: 0 4px; cursor: pointer; }
.pr-nom button { font: inherit; font-size: 11px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--ligne); background: var(--carte); color: var(--texte); }
.p-art { display: flex; align-items: center; gap: 8px; }
.p-photo { position: relative; width: 40px; height: 40px; flex: none; border-radius: 8px; background: var(--gris-fond); cursor: pointer;
  display: grid; place-items: center; color: var(--doux); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.p-photo img { width: 40px; height: 40px; object-fit: contain; border-radius: 8px; background: #fff; display: block; pointer-events: none; }
.p-qte { position: absolute; right: -5px; bottom: -5px; min-width: 18px; text-align: center; font-size: 11px; font-weight: 700;
  border-radius: 9px; padding: 0 5px; background: var(--accent); color: #fff; }
/* + / − : le chiffre s'allume (halo foncé puis clair, comme le cadre d'un ajout) ; à 1, « − » montre un sablier avant le retrait */
.qte-flash { animation: qteFlash 1.1s ease-out; }
@keyframes qteFlash {
  0% { transform: scale(1.55); box-shadow: 0 0 0 4px rgba(0,0,0,.55), 0 0 14px 4px var(--accent); }
  40% { transform: scale(1.15); box-shadow: 0 0 0 3px rgba(0,0,0,.3), 0 0 10px 2px var(--accent); }
  100% { transform: scale(1); box-shadow: 0 0 0 0 transparent, 0 0 0 0 transparent; }
}
/* Pastille de retrait : rond rouge, anneau blanc qui se vide en 0,85 s autour d'un « − », léger battement */
.en-retrait { display: inline-grid; place-items: center; width: 24px; height: 24px; min-width: 0; padding: 0; border-radius: 50%;
  background: var(--rouge, #c0392b); color: #fff; box-shadow: 0 0 0 3px color-mix(in srgb, var(--rouge, #c0392b) 30%, transparent);
  animation: retraitBat .85s ease-in-out; }
.p-qte.en-retrait { right: -8px; bottom: -8px; }
.sablier { width: 20px; height: 20px; display: block; }
.sablier .rebours { stroke-dashoffset: 0; animation: rebours .85s linear forwards; }
@keyframes rebours { to { stroke-dashoffset: 100; } }
@keyframes retraitBat { 0% { transform: scale(.6); } 25% { transform: scale(1.15); } 45%, 100% { transform: scale(1); } }
tr.se-vide > td, .item-liste.se-vide { opacity: 0; transition: opacity .22s; }
@media (prefers-reduced-motion: reduce) { .qte-flash, .en-retrait, .sablier .rebours { animation: none; } }
.p-rappel { position: absolute; top: -7px; left: -7px; width: 18px; height: 16px; }
.p-photo.appui::after { content: ''; position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: var(--rouge); border-radius: 2px;

.p-txt { min-width: 0; flex: 1; overflow: hidden; cursor: pointer; }

details > summary { list-style: none; cursor: pointer; }
